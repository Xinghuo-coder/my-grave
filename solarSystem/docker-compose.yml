# ========================================
# 本地 Docker Compose 开发环境
# 用于本地测试 MySQL 和完整应用栈
# ========================================

version: '3.8'

services:
  # ========================================
  # MySQL 数据库服务
  # ========================================
  mysql:
    image: mysql:8.0
    container_name: solar-system-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password_dev
      MYSQL_DATABASE: solar_system_db
      MYSQL_USER: solar_app_user
      MYSQL_PASSWORD: dev_password_123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./server/database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # ========================================
  # Node.js 应用服务
  # ========================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: solar-system-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      - NODE_ENV=development
      - PORT=8080
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=solar_system_db
      - DB_USER=solar_app_user
      - DB_PASSWORD=dev_password_123
      - SESSION_SECRET=dev-secret-key-for-local-testing
      - FRONTEND_URL=http://localhost:8095
      - USE_SECRET_MANAGER=false
    ports:
      - "3000:8080"
    volumes:
      - ./server:/app/server
      - ./dist:/app/dist
    command: node server/index.js

volumes:
  mysql_data:
    driver: local
