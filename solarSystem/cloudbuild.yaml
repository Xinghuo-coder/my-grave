# ========================================
# Google Cloud Build 配置文件
# 用于自动化 CI/CD 流程
# ========================================

steps:
  # ========================================
  # Step 1: 安装依赖并运行测试
  # ========================================
  - name: 'node:18-alpine'
    id: 'install-and-test'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        npm ci
        npm run test || echo "Tests not configured"

  # ========================================
  # Step 2: 构建 Docker 镜像
  # ========================================
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-image'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/solar-system:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/solar-system:latest'
      - '-f'
      - 'Dockerfile'
      - '.'
    waitFor: ['install-and-test']

  # ========================================
  # Step 3: 推送镜像到 Container Registry
  # ========================================
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-image'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/solar-system:$COMMIT_SHA'
    waitFor: ['build-image']

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-latest'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/solar-system:latest'
    waitFor: ['build-image']

  # ========================================
  # Step 4: 部署到 Cloud Run
  # ========================================
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-to-cloud-run'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'solar-system-app'
      - '--image=gcr.io/$PROJECT_ID/solar-system:$COMMIT_SHA'
      - '--region=asia-east1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=10'
      - '--concurrency=80'
      - '--timeout=300'
      - '--set-env-vars=NODE_ENV=production'
      - '--set-secrets=SESSION_SECRET=session-secret:latest,DB_PASSWORD=db-password:latest'
      - '--add-cloudsql-instances=$_CLOUD_SQL_INSTANCE'
      - '--vpc-connector=$_VPC_CONNECTOR'
    waitFor: ['push-image']

# ========================================
# 构建镜像配置
# ========================================
images:
  - 'gcr.io/$PROJECT_ID/solar-system:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/solar-system:latest'

# ========================================
# 替换变量（在触发器中配置）
# ========================================
substitutions:
  _CLOUD_SQL_INSTANCE: 'YOUR_PROJECT_ID:REGION:INSTANCE_NAME'
  _VPC_CONNECTOR: 'projects/YOUR_PROJECT_ID/locations/REGION/connectors/YOUR_CONNECTOR'

# ========================================
# 构建选项
# ========================================
options:
  machineType: 'N1_HIGHCPU_8'
  substitutionOption: 'ALLOW_LOOSE'
  logging: CLOUD_LOGGING_ONLY

# ========================================
# 超时配置
# ========================================
timeout: '1200s'
